  <text x="120" y="135" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="20" letter-spacing="4" font-weight="700" fill="#9fb8d4">FXRETINA HEALTHCARE · BLOG</text>
  <text x="118" y="240" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="68" font-weight="800" fill="#ffffff">Healthcare Marketing</text>
  <text x="118" y="318" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="68" font-weight="800" fill="#7FC4F0">Insights &amp; Guides</text>
</svg>
