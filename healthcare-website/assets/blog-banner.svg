  </defs>
  <rect width="1600" height="480" fill="url(#g)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <!-- soft glow circles -->
  <circle cx="1320" cy="120" r="200" fill="#15B79E" opacity="0.10"/>
  <circle cx="1480" cy="380" r="160" fill="#FF6B4A" opacity="0.12"/>
